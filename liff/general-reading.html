<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一般占い - ルカのタロット占い</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
      padding: 20px;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .header p {
      font-size: 16px;
      opacity: 0.9;
    }

    .theme-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    .theme-card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 15px;
      text-decoration: none;
      color: inherit;
    }

    .theme-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }

    .theme-card:active {
      transform: translateY(-2px);
    }

    .theme-card.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .theme-icon {
      font-size: 48px;
      min-width: 60px;
      text-align: center;
    }

    .theme-content {
      flex: 1;
    }

    .theme-title {
      font-size: 22px;
      font-weight: bold;
      color: #333;
      margin-bottom: 5px;
    }

    .theme-description {
      font-size: 14px;
      color: #666;
      line-height: 1.4;
    }

    .footer {
      text-align: center;
      color: white;
      margin-top: 30px;
      padding: 20px;
      opacity: 0.8;
      font-size: 14px;
    }

    .loading {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }

    .loading.active {
      display: flex;
    }

    .loading-content {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔮 一般占い 🔮</h1>
      <p>どのテーマで占いたいですか？</p>
    </div>

    <div class="theme-grid">
      <div class="theme-card" onclick="selectTheme('仕事運')">
        <div class="theme-icon">💼</div>
        <div class="theme-content">
          <div class="theme-title">仕事運</div>
          <div class="theme-description">今の仕事の状況や今後の展開は？</div>
        </div>
      </div>

      <div class="theme-card" onclick="selectTheme('金運')">
        <div class="theme-icon">💰</div>
        <div class="theme-content">
          <div class="theme-title">金運</div>
          <div class="theme-description">お金の流れや財運の状態は？</div>
        </div>
      </div>

      <div class="theme-card" onclick="selectTheme('健康運')">
        <div class="theme-icon">🏥</div>
        <div class="theme-content">
          <div class="theme-title">健康運</div>
          <div class="theme-description">体調や健康面で気をつけることは？</div>
        </div>
      </div>

      <div class="theme-card" onclick="selectTheme('人間関係運')">
        <div class="theme-icon">👥</div>
        <div class="theme-content">
          <div class="theme-title">人間関係運</div>
          <div class="theme-description">周りの人との関係性はどう？</div>
        </div>
      </div>
    </div>

    <div class="footer">
      タップするとLINEに戻って占いが始まります✨
    </div>
  </div>

  <div class="loading" id="loading">
    <div class="loading-content">
      <div class="spinner"></div>
      <p>今日カード達は何を伝えたいのか…🌟<br>どんな運命が…🎴</p>
    </div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    let userId = null;

    // LIFF初期化
    liff.init({
      liffId: '2008750510-wk5DplkU'
    }).then(() => {
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      
      // ユーザーIDを取得
      liff.getProfile().then(profile => {
        userId = profile.userId;
      }).catch(err => {
        console.error('Profile error:', err);
      });
    }).catch(err => {
      console.error('LIFF init error:', err);
      alert('LIFFの初期化に失敗しました');
    });

    // テーマ選択
    async function selectTheme(theme) {
      if (!userId) {
        alert('ユーザー情報を取得中です。もう一度お試しください。');
        return;
      }

      // ローディング表示
      document.getElementById('loading').classList.add('active');

      // すべてのカードを無効化
      document.querySelectorAll('.theme-card').forEach(card => {
        card.classList.add('disabled');
      });

      try {
        // サーバーにリクエストを送信
        const response = await fetch('https://tarot-linebot.onrender.com/api/send-reading', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            userId: userId,
            type: 'general',
            theme: theme
          })
        });

        const result = await response.json();

        if (result.success) {
          // 成功したらLIFFウィンドウを閉じる
          setTimeout(() => {
            liff.closeWindow();
          }, 500);
        } else {
          throw new Error('Failed to send message');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('エラーが発生しました。もう一度お試しください。');
        
        // ローディングを非表示
        document.getElementById('loading').classList.remove('active');
        
        // カードを再度有効化
        document.querySelectorAll('.theme-card').forEach(card => {
          card.classList.remove('disabled');
        });
      }
    }
  </script>
</body>
</html>
